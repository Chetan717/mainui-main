  <body>
    <div id="root"></div>
    <script>
      // Queue Android WebView messages immediately. The app bundle and Signup
      // route load later, after Splash/Onboarding, but Play install-referrer is
      // commonly delivered only once on the first launch.
      (() => {
        const queue = [];
        const capture = (event) => {
          queue.push(event.data);
          if (queue.length > 20) queue.shift();
        };

        window.__MLMLIVE_EARLY_BRIDGE_MESSAGES__ = queue;
        window.__MLMLIVE_EARLY_BRIDGE_HANDLER__ = capture;
        window.addEventListener("message", capture);
        document.addEventListener("message", capture);
      })();
    </script>
    <script>
      // Register the shared FCM/offline service worker for every visitor, not
      // only after the notification hook mounts. This lets returning users see
      // our own No Internet screen before the React bundle can load.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("/firebase-messaging-sw.js", { scope: "/" })
          .catch(() => {});
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
